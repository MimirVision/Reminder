# Builds an UNSIGNED iPhone app (.ipa) in the cloud on a free Mac runner, so you can install it with Sideloadly using a free
# Apple ID (it expires after 7 days; re-install to renew). See docs/SIDELOAD.md.
# Run it from GitHub: Actions > "Build iPhone app (unsigned)" > Run workflow. Then download "HomeMemory-unsigned-ipa".
# Needs two repository secrets (Settings > Secrets and variables > Actions): EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY.
name: Build iPhone app (unsigned)
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode version to build with (latest-stable, or e.g. 26.2)"
        default: latest-stable
      patch_jsi_header:
        description: "Remove the SWIFT_RETURNS_RETAINED markers that Xcode 26.3 rejects in expo-modules-jsi (true/false)"
        default: "true"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the two secrets are set
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secrets EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY first (Settings > Secrets and variables > Actions)."; exit 1
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "${{ inputs.xcode || 'latest-stable' }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Work around an Xcode 26.3 compile error in expo-modules-jsi
        if: ${{ inputs.patch_jsi_header != 'false' }}
        working-directory: apps/mobile
        run: |
          # Xcode 26.3 rejects SWIFT_RETURNS_RETAINED on RuntimeScheduler's constructors ("not returning a SWIFT_SHARED_REFERENCE type").
          F=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          sed -i '' 's/SWIFT_RETURNS_RETAINED //' "$F"
          ! grep -n "SWIFT_RETURNS_RETAINED" "$F"
      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mobile
        run: cd ios && pod install
      - name: Remove the push entitlement (a free Apple ID cannot sign it; local reminders and place reminders do not need it)
        working-directory: apps/mobile
        run: |
          for f in ios/*/*.entitlements; do /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" || true; done
      - name: Build (no signing)
        working-directory: apps/mobile
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          # The whole log goes to a file (uploaded below); a failed build must fail this step, and its errors are printed here.
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1; then
            echo "::error::xcodebuild failed. The first errors are below; the full log is in the 'build-log' artifact."
            grep -n -E "error:|Error:|failed|FAILED|fatal" build.log | cut -c1-400 | head -60
            echo "----- last 80 lines -----"; tail -n 80 build.log | cut -c1-400
            exit 1
          fi
      - name: Package the .ipa
        working-directory: apps/mobile
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          test -f "$APP/Info.plist" || { echo "::error::The built app has no Info.plist, so the build is incomplete: $APP"; ls -la "$APP"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry HomeMemory-unsigned.ipa Payload
          ls -la HomeMemory-unsigned.ipa
          test "$(stat -f%z HomeMemory-unsigned.ipa)" -gt 1000000 || { echo "::error::The .ipa is suspiciously small"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: apps/mobile/build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: HomeMemory-unsigned-ipa
          path: apps/mobile/HomeMemory-unsigned.ipa
          if-no-files-found: error
