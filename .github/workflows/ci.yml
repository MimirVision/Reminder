name: CI
on:
  push:
  pull_request:

jobs:
  supabase:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: supabase } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: supabase/package-lock.json }
      - run: npm ci
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mail:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mail } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mail/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  spike:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/spike } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/spike/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
