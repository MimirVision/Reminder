# Builds the web app with your Supabase settings so you can host it without running npm yourself.
# Run it from GitHub: Actions > "Build web app" > Run workflow. Then download the "web-dist" file from the run page,
# unzip it, and drag the folder onto https://app.netlify.com/drop.
# Needs two repository secrets (Settings > Secrets and variables > Actions): VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY.
name: Build web app
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
