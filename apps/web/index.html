<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F3F5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Home Memory" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" />
    <title>Home Memory</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      (function () { try { var p = localStorage.getItem('hm.theme'); var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = p === 'light' || p === 'dark' ? p : 'system'; var d = document.documentElement; d.dataset.theme = t; d.dataset.resolved = t === 'system' ? (m ? 'dark' : 'light') : t;
        var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', d.dataset.resolved === 'dark' ? '#0F1217' : '#F2F3F5'); } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
