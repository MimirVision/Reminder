<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Ledger</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#18191d" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <script>
      // Apply the saved theme before first paint, so dark mode never flashes white.
      try {
        var r = document.documentElement, t = localStorage.getItem('ledger-theme') || 'light', a = localStorage.getItem('ledger-accent'), d = localStorage.getItem('ledger-density');
        if (t !== 'system') r.dataset.theme = t;
        if (a && a !== 'cobalt') r.dataset.accent = a;
        if (d === 'compact') r.dataset.density = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
